services:
  nftfax:
    # Pulled from GHCR, built by .github/workflows/build-image.yml. Never build
    # on this box: the 8 GB host runs the live containers, and an on-box
    # `next build` OOM-killed dockerd once already. Deploy with:
    #   docker compose pull && docker compose up -d
    image: ghcr.io/eyemine/nftfax:latest
    container_name: nftfax-nftfax-1
    environment:
      - WORKER_SECRET=${WORKER_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NFTMAIL_WEBHOOK_SECRET=${NFTMAIL_WEBHOOK_SECRET}
      - PINATA_JWT=${PINATA_JWT}
      - IRYS_PRIVATE_KEY=${IRYS_PRIVATE_KEY}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - GASLESS_DAILY_CAP=${GASLESS_DAILY_CAP:-100}
      - GNOSIS_RPC_URL=${GNOSIS_RPC_URL:-https://rpc.gnosischain.com}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY:-}
      - ENVIO_GRAPHQL_URL=${ENVIO_GRAPHQL_URL:-}
    ports:
      - "3002:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
