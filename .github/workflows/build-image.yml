# Builds the production image off the server and publishes it to GHCR.
#
# Why: `docker compose up --build` on the 8 GB Hetzner box ran `next build`
# beside the live containers. BuildKit cache was never pruned (112 GB, 775
# entries), dockerd grew to 2.7 GB tracking it, and one build OOM-killed the
# daemon and took nftmail.box down with it. The server should only ever PULL.
#
# The image bakes only NEXT_PUBLIC_* values, which are public in every browser
# by definition. Runtime secrets stay in /opt/nftfax/.env and are injected by
# compose; nothing sensitive is in the image, so the package can be public and
# the server pulls anonymously.
#
# Deploy (on the server):   cd /opt/nftfax && docker compose pull && docker compose up -d

name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public values, safe to bake. Override in repo Variables if they change.
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || 'cmlw4x5gc02pt0bl77efz72xa' }}
            NEXT_PUBLIC_NFTMAIL_URL=${{ vars.NEXT_PUBLIC_NFTMAIL_URL || 'https://nftmail.box' }}
            NEXT_PUBLIC_WORKER_URL=${{ vars.NEXT_PUBLIC_WORKER_URL || 'https://worker.nftmail.box' }}
          # Layer cache lives in GitHub, not on the server.
          cache-from: type=gha
          cache-to: type=gha,mode=max
